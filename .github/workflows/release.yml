name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.4)'
        required: true

jobs:
  goreleaser:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Funnel all untrusted refs through env so they never interpolate into shell/action args directly.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$'; then
            echo "Refusing to bump — tag '$RELEASE_TAG' is not a valid semver-style tag." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: 'v2.9.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}

  verify:
    name: Verify release distribution
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify GitHub release assets
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,tagName)"

          tag_name="$(jq -r '.tagName' <<<"$release_json")"
          if [ "$tag_name" != "$RELEASE_TAG" ]; then
            echo "Release tag mismatch: expected $RELEASE_TAG, got $tag_name" >&2
            exit 1
          fi

          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]; then
            echo "Release $RELEASE_TAG is still a draft" >&2
            exit 1
          fi

          expected_assets=(
            "checksums.txt"
            "mnemo_${version}_darwin_amd64.tar.gz"
            "mnemo_${version}_darwin_arm64.tar.gz"
            "mnemo_${version}_linux_amd64.tar.gz"
            "mnemo_${version}_linux_arm64.tar.gz"
            "mnemo_${version}_windows_amd64.zip"
            "mnemo_${version}_windows_arm64.zip"
          )

          asset_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          echo "$asset_names"

          for asset in "${expected_assets[@]}"; do
            if ! grep -Fxq "$asset" <<<"$asset_names"; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Verify Homebrew tap formula
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          formula="$(gh api 'repos/Yanvi-Robotics/homebrew-tap/contents/Formula/mnemo.rb?ref=main' --jq '.content' | base64 --decode)"

          if ! grep -Fq "version \"${version}\"" <<<"$formula"; then
            echo "Homebrew formula version does not match ${RELEASE_TAG}" >&2
            echo "$formula" >&2
            exit 1
          fi

          if ! grep -Fq "https://github.com/Yanvi-Robotics/mnemo/releases/download/${RELEASE_TAG}/" <<<"$formula"; then
            echo "Homebrew formula does not use ${RELEASE_TAG} release assets" >&2
            echo "$formula" >&2
            exit 1
          fi

          if ! grep -Fq 'system "#{bin}/mnemo", "version"' <<<"$formula" &&
             ! grep -Fq 'assert_match "mnemo", shell_output("#{bin}/mnemo version")' <<<"$formula"; then
            echo "Homebrew formula is missing the mnemo version smoke test" >&2
            echo "$formula" >&2
            exit 1
          fi
